name: "[CI] PR Validation"

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  swift-test:
    name: "Test: Swift Package"
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run Swift Unit Tests
        run: ./platforms/ios/scripts/test_local.sh

  build-xcframework:
    name: "Build: iOS XCFramework"
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build XCFramework
        run: ./scripts/build_local.sh --clean

      - name: Verify XCFramework Artifact
        run: |
          if [ ! -d "platforms/godot_editor/addons/att/ios/bin/GodotATTPlugin.xcframework" ]; then
            echo "Error: GodotATTPlugin.xcframework was not generated!" >&2
            exit 1
          fi

  gdlint:
    name: "Lint: GDScript"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install gdlint
        run: |
          python -m pip install --upgrade pip
          pip install gdtoolkit

      - name: Run gdlint
        run: gdlint platforms/godot_editor/addons/

  pr-validation-status:
    name: "PR Validation Status"
    needs: [swift-test, build-xcframework, gdlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.swift-test.result }}" != "success" ] || \
             [ "${{ needs.build-xcframework.result }}" != "success" ] || \
             [ "${{ needs.gdlint.result }}" != "success" ]; then
            echo "PR validation failed!" >&2
            exit 1
          fi
          echo "All PR validations passed successfully."
